# Standalone production stack for private.wf beta (M4). Secrets via environment, never in git.
# Usage: docker compose -f infra/docker/compose.prod.yml up -d --build
# Images are also built+pushed by the CI release workflow (ghcr.io).

services:
  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-privatewf}
      POSTGRES_USER: ${DB_USERNAME:-privatewf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:latest
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 30

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?run php artisan key:generate --show and set APP_KEY}
      APP_URL: ${APP_URL:-https://private.wf}
      WEB_URL: ${WEB_URL:-https://private.wf}
      DB_DSN: "pgsql:host=pgsql;port=5432;dbname=${DB_DATABASE:-privatewf}"
      DB_USER: ${DB_USERNAME:-privatewf}
      DB_PASS: ${DB_PASSWORD:?set DB_PASSWORD}
      HMAC_SECRET: ${HMAC_SECRET:?set HMAC_SECRET}
      AUDIT_SALT: ${AUDIT_SALT:-}
      USER_QUOTA_BYTES: ${USER_QUOTA_BYTES:-10737418240}
      SOVEREIGN_PATH: /srv/private-wf/vault
      CLAMAV_HOST: clamav
      S3_L1_ENDPOINT: ${S3_L1_ENDPOINT:-}
      S3_L1_BUCKET: ${S3_L1_BUCKET:-privatewf-l1}
      S3_L1_KEY: ${S3_L1_KEY:-}
      S3_L1_SECRET: ${S3_L1_SECRET:-}
      S3_L1_REGION: ${S3_L1_REGION:-auto}
      SFTP_L2_HOST: ${SFTP_L2_HOST:-}
      SFTP_L2_PORT: ${SFTP_L2_PORT:-22}
      SFTP_L2_USER: ${SFTP_L2_USER:-}
      SFTP_L2_PASSWORD: ${SFTP_L2_PASSWORD:-}
      SFTP_L2_ROOT: ${SFTP_L2_ROOT:-/vault}
    volumes:
      - vault:/srv/private-wf/vault
    depends_on:
      pgsql:
        condition: service_healthy

  worker: # scheduler: pwf:purge nightly, pwf:quarantine hourly (routes/console.php)
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?run php artisan key:generate --show and set APP_KEY}
      APP_URL: ${APP_URL:-https://private.wf}
      DB_DSN: "pgsql:host=pgsql;port=5432;dbname=${DB_DATABASE:-privatewf}"
      DB_USER: ${DB_USERNAME:-privatewf}
      DB_PASS: ${DB_PASSWORD:?set DB_PASSWORD}
      HMAC_SECRET: ${HMAC_SECRET:?set HMAC_SECRET}
      SOVEREIGN_PATH: /srv/private-wf/vault
      CLAMAV_HOST: clamav
    volumes:
      - vault:/srv/private-wf/vault
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: ${APP_URL:-https://private.wf}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - nginx

volumes:
  pgdata:
  vault:
