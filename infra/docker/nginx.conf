upstream api { server api:9000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 0; # chunked uploads stream; limits enforced in-app

    location / {
        try_files $uri @api;
    }

    location @api {
        fastcgi_pass api;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/app/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Long-lived tus PATCH + blob streams: generous but bounded.
    proxy_read_timeout 3600s;
    fastcgi_read_timeout 3600s;
    fastcgi_request_buffering off;
}
