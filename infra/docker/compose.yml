services:
  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-privatewf}
      POSTGRES_USER: ${DB_USERNAME:-privatewf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio: # local fake for Cloudflare R2 / S3 L1
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]

  sftp: # local fake for L2 provider vault (DE)
    image: atmoz/sftp:latest
    command: "vault:changeme:1001:100:vault"
    volumes: ["sftpdata:/home/vault/vault"]
    ports: ["2222:22"]

  clamav:
    image: clamav/clamav:latest
    ports: ["3310:3310"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  api: # M2a lean PHP router (Laravel lands M2b per ADR-0001)
    build:
      context: ../..
      dockerfile: infra/docker/php.Dockerfile
    volumes: ["../../apps/api:/app"]
    environment:
      APP_URL: http://localhost:8000
      WEB_URL: http://localhost:3000
      HMAC_SECRET: ${HMAC_SECRET:-changeme-sovereign}
      CLAMAV_HOST: clamav
      SFTP_L2_HOST: sftp
      SFTP_L2_USER: vault
      SFTP_L2_PASSWORD: changeme
      SFTP_L2_ROOT: /home/vault/vault
    ports: ["8000:8000"]
    depends_on: [pgsql, redis]

  web:
    image: node:22-alpine
    working_dir: /web
    volumes: ["../../apps/web:/web"]
    command: sh -c "npm install --no-audit --no-fund 2>/dev/null; npm run dev"
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
  sftpdata:
