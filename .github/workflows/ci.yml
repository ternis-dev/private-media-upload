name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  plans-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plans exist
        run: test -f .plans/00-vision.md && test -f .plans/04-roadmap.md && echo "plans OK"
      - name: Validate docker compose
        run: docker compose -f infra/docker/compose.yml config
