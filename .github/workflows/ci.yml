name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  storage-drivers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: curl }
      - run: composer install --no-interaction
        working-directory: packages/storage-drivers
      - run: vendor/bin/phpunit --colors=never
        working-directory: packages/storage-drivers
      - name: Live MinIO roundtrip (R2 stand-in)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break || sleep 3
          done
          TEST_MINIO_ENDPOINT=http://localhost:9000 vendor/bin/phpunit --colors=never --filter R2Minio
        working-directory: packages/storage-drivers
      - name: Live SFTP roundtrip (Hetzner-box stand-in)
        run: |
          docker run -d --name sftp -p 2222:22 atmoz/sftp vault:secret:1001:100:vault
          sleep 5
          TEST_SFTP_HOST=localhost TEST_SFTP_PORT=2222 TEST_SFTP_USER=vault TEST_SFTP_PASS=secret TEST_SFTP_ROOT=/home/vault/vault vendor/bin/phpunit --colors=never --filter SftpLive
        working-directory: packages/storage-drivers

  api-domain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: privatewf_test
          POSTGRES_USER: pwf
          POSTGRES_PASSWORD: pwf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pwf -d privatewf_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_sqlite, pdo_pgsql' }
      - run: composer install --no-interaction
        working-directory: packages/api-domain
      - run: vendor/bin/phpunit --colors=never
        working-directory: packages/api-domain
      - name: pgsql compatibility (prod target)
        run: PWF_PGSQL_DSN="pgsql:host=localhost;port=5432;dbname=privatewf_test" PWF_PGSQL_USER=pwf PWF_PGSQL_PASS=pwf vendor/bin/phpunit --colors=never --filter PgsqlCompat
        working-directory: packages/api-domain

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'zip, pdo_sqlite' }
      - run: composer install --no-interaction
        working-directory: apps/api
      - run: cp .env.example .env && php artisan key:generate
        working-directory: apps/api
      - run: php artisan test
        working-directory: apps/api
      - run: php artisan migrate --force
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --dir apps/web || npm install --prefix apps/web
      - run: node --test test/tiers.test.mjs test/uploads.test.mjs test/e2ee.test.mjs
        working-directory: apps/web
      - run: npx -y esbuild@0.24 app/page.tsx "app/s/[id]/page.tsx" app/me/page.tsx lib/tiers.ts lib/uploads.ts lib/e2ee.ts --jsx=automatic --outdir=/tmp/esbuild-check --log-level=warning
        working-directory: apps/web

  # Bonus live signal (freshclam on first boot is slow/flaky → non-blocking).
  quarantine-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: zip }
      - run: composer install --no-interaction
        working-directory: apps/api
      - name: ClamAV daemon + EICAR quarantine proof
        run: |
          docker run -d --name clamav -p 3310:3310 clamav/clamav:latest
          for i in $(seq 1 100); do
            docker exec clamav clamdcheck.sh >/dev/null 2>&1 && break || sleep 6
          done
          printf 'X5O!P%%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar.txt
          CLAMAV_HOST=localhost php -r '
            require "vendor/autoload.php";
            $clam = new PrivateWf\Api\ClamAv("localhost");
            $hit = $clam->scanFile("/tmp/eicar.txt");
            if ($hit === null) { fwrite(STDERR, "EICAR NOT detected\n"); exit(1); }
            echo "EICAR detected: $hit\n";'
        working-directory: apps/api

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker/compose.yml config
