openapi: 3.0.3
info:
  title: private.wf API
  version: 0.5.0-M4
  description: M4 beta. Adds thumbnails (?thumb=1 previews), abuse reports, deep health, security headers. Same upload/share/auth/tus/E2EE contract as 0.4.0.
servers:
  - url: http://localhost:8000
paths:
  /v1/auth/register:
    post:
      summary: Register (email, account password 12..256). Returns user id.
      responses:
        '201': { description: '{id}' }
        '409': { description: email taken }
        '422': { description: validation error }
  /v1/auth/login:
    post:
      summary: Login → Bearer token (generic 401, no enumeration; 5/min/IP)
      responses:
        '200': { description: '{token}' }
        '401': { description: invalid credentials }
  /v1/auth/logout:
    post:
      summary: Revoke current Bearer token
      responses:
        '200': { description: '{ok: true}' }
  /v1/me/assets:
    get:
      summary: Owned assets + usage/quota (Bearer)
      responses:
        '200': { description: '{assets, usage, quota}' }
        '401': { description: unauthorized }
  /v1/me/export:
    get:
      summary: Per-user GDPR manifest (json) or real ZIP of owned bytes (?format=zip)
      responses:
        '200': { description: manifest or ZIP }
        '401': { description: unauthorized }
  /v1/me:
    delete:
      summary: Password-confirmed account erasure (blobs + rows + tokens + user)
      responses:
        '200': { description: '{deletedShares, account: deleted}' }
        '401': { description: unauthorized / invalid credentials }
  /v1/uploads/tus:
    post:
      summary: tus 1.0.0 Creation (?tier=, Upload-Length + Upload-Metadata filename required) → 201 + Location
      responses:
        '201': { description: empty, Location header }
        '412': { description: Tus-Resumable missing }
        '413': { description: quota exceeded }
        '422': { description: bad length/metadata }
  /v1/uploads/tus/{uploadId}:
    head:
      summary: tus offset discovery (Upload-Offset + Upload-Length)
    patch:
      summary: tus append (strict Upload-Offset, 409 on mismatch) → 204 + Upload-Offset
    delete:
      summary: tus termination (drops staging + reservation) → 204
  /health:
    get:
      summary: Liveness
      responses:
        '200': { description: ok }
  /v1/tiers:
    get:
      summary: Privacy tiers L1/L2/L3
      responses:
        '200': { description: tiers }
  /v1/uploads/init:
    post:
      summary: Reserve upload. L1 real mode returns SigV4 presignedPutUrl; else proxy via appendUrl.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier, filename, size]
              properties:
                tier: { type: string, enum: [L1, L2, L3] }
                filename: { type: string, maxLength: 255 }
                size: { type: integer, minimum: 1, maximum: 5368709120 }
                mime: { type: string, default: application/octet-stream }
      responses:
        '201': { description: '{uploadId, key, appendUrl, mode, presignedPutUrl?}' }
        '422': { description: validation error }
        '502': { description: L1 storage unreachable }
  /v1/uploads/{uploadId}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string, pattern: '^up_[0-9A-Za-z]{8,32}$' } }
    put:
      summary: Append raw bytes (repeatable 4–10 MB chunks)
      responses:
        '200': { description: '{received, expected, done}' }
        '404': { description: unknown upload }
        '413': { description: exceeds declared size }
    post:
      summary: Alias of PUT (proxy-friendly)
      responses:
        '200': { description: '{received, expected, done}' }
  /v1/uploads/{uploadId}/complete:
    post:
      summary: Verify size/sha256, scan (skipped for e2ee ciphertext), streaming putFile, mint share (opts: password 8..256, maxViews 1..100000, burn, e2ee)
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: '{shareId, shareUrl, size, sha256, expiresAt}' }
        '422': { description: incomplete upload / bad opts / malware }
        '429': { description: rate limited }
  /v1/uploads/l1-complete:
    post:
      summary: Finalize browser-direct-to-R2 upload (same share opts; AV scan deferred to worker)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, filename, size]
              properties:
                key: { type: string, pattern: '^u/l1/' }
                filename: { type: string }
                size: { type: integer, minimum: 1 }
                mime: { type: string }
                password: { type: string, minLength: 8, maxLength: 256 }
                maxViews: { type: integer, minimum: 1, maximum: 100000 }
                burn: { type: boolean }
                e2ee: { type: boolean, description: 'PWF1 ciphertext; server skips sniff+scan, stores opaque' }
      responses:
        '201': { description: share }
        '422': { description: object missing / size mismatch }
  /v1/shares/{id}/meta:
    get:
      summary: Share metadata (no bytes). Password via X-Share-Password header (or ?password=).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9A-Za-z]{8,32}$' } }
      responses:
        '200': { description: '{tier, badge, residency, filename, mime, size, sha256, expiresAt, hasPassword, views, maxViews, burn, e2ee}' }
        '401': { description: password required / wrong }
        '404': { description: unknown (or purged) }
        '410': { description: expired / revoked / view limit reached }
        '429': { description: rate limited (60/min/IP) }
  /v1/shares/{id}/export:
    get:
      summary: Capability-based GDPR manifest (metadata + access log + retention note)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: manifest }
        '401': { description: password required / wrong }
        '404': { description: unknown }
        '410': { description: expired / revoked }
  /v1/shares/{id}:
    delete:
      summary: Revoke now (link dies, bytes deleted immediately, rows swept by purge)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{revoked: true}' }
        '401': { description: password required / wrong }
        '404': { description: unknown }
  /v1/shares/{id}/report:
    post:
      summary: File an abuse report (unauthenticated, 10/h; review via pwf:reports)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [csam, terror, copyright, malware, other] }
                contact: { type: string, format: email }
      responses:
        '201': { description: '{reportId}' }
        '404': { description: unknown }
        '422': { description: bad reason/contact }
        '429': { description: rate limited }
  /v1/health:
    get:
      summary: Deep health (always 200; ok:false when degraded). Probes db, tiers, clamav.
      responses:
        '200': { description: '{ok, checks: {db, storage: {L1, L2, L3}, clamav}}' }
  /v1/blobs/{key}:
    get:
      summary: Stream bytes. HMAC ?expires&sig. Range supported. L1 real mode 302s to R2.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: bytes }
        '206': { description: partial content }
        '401': { description: password required / wrong }
        '403': { description: bad/expired signature }
        '404': { description: unknown (burned/purged) }
        '410': { description: blob purged / view limit reached }
        '416': { description: unsatisfiable range }
        '429': { description: rate limited (120/min/IP) }
  /s/{id}:
    get:
      summary: Short link → 302 to tier-appropriate signed URL (consumes view for L1-real only). ?thumb=1 previews the thumbnail (gated, never consumes).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '302': { description: redirect (L1-real TTL 5 min, else 15 min) }
        '401': { description: password required / wrong }
        '404': { description: unknown / no thumbnail }
        '410': { description: expired / revoked / view limit reached }
